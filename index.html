<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>

    <style>
      /* Reset default margin and padding */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        padding-bottom: 100px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #fff;
      }

      header {
        position: absolute;
        top: 15px;
        right: 25px;
        display: flex;
        gap: 20px;
        align-items: center;
        font-size: 14px;
      }

      header a {
        text-decoration: none ;
        font-family: Arial, Helvetica, sans-serif;
        color: #000;
        font-weight: 400;
      }

      header a:hover {
        text-decoration: underline;
      }

      /* Google logo */
      .logo {
        margin-bottom: 30px;
      }

      /* Search bar */
      .search-box {
        display: flex;
        align-items: center;
        border: 1px solid gray;
        border-radius: 24px;
        padding: 10px 15px;
        width: 550px;
        max-width: 90%;
        transition: box-shadow 0.2s;
      }

      .search-box:hover {
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      }

      .search-box input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
      }

      /* Buttons */

      

      .buttons {
        justify-content: center;
        margin-top: 30px;
        display: flex;
        gap: 10px;
      }

      .buttons input {
        padding: 8px 16px;
        font-size: 14px;
        border: 1px solid #f8f9fa;
        border-radius: 4px;
        background-color: #f8f9fa;
        cursor: pointer;
      }

      .buttons input:hover {
        border: 1px solid #dadce0;
      }

      /* Footer (optional) */
      footer {
        position: absolute;
        bottom: 20px;
        font-size: 14px;
        color: #70757a;
      }

      


    </style>
  </head>

  <body>

    <header>
        <a href="https://mail.google.com/">Gmail</a>
        <a href="https://www.google.com/imghp">Images</a>
    </header>


    <!-- Google logo -->
    <img
      class="logo"
      src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
      alt="Google"
      width="272"
      height="92"
    />

    <!-- Search box -->
    <form action="https://www.google.com/search">
      <div class="search-box">
        <input type="text" name="q" />
      </div>

      <div class="buttons">
        <input type="submit" value="Google Search" />
        <input type="submit" value="I'm Feeling Lucky" name="btnI" />
      </div>
    </form>

    <button>
        
    </button>

    <footer>
      <p>India</p>
    </footer>
  </body>
</html>
